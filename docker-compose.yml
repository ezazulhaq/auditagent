name: auditagent

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # Primary transactional storage for reports, findings, users, runs, checkpoints
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: auditagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auditagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-auditagent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auditagent-net

  # ----------------------------------------------------------------------------
  # AuditAgent Main Full-Stack Application Service
  # Houses Spring Boot, Embedded Static Frontend, and All Built-in Tools:
  #   - Java 21 JDK (runtime & compilation)
  #   - Semgrep CLI (security scanner)
  #   - Maven & Gradle (build & test runners)
  #   - Git (managed clone & PR operations)
  #   - DuckDB (FTS lexical memory store)
  # ----------------------------------------------------------------------------
  auditagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditagent-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUDITAGENT_PORT:-8173}:8173"
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auditagent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auditagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # DuckDB FTS Knowledge Base & Isolated Workspaces
      AUDITAGENT_DB_PATH: /var/lib/auditagent/data/audit_reports.duckdb
      AUDITAGENT_WORKSPACE_ROOT: /var/lib/auditagent/workspaces

      # LLM / Model Credentials & Endpoints
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      PROVIDER_MODEL: ${PROVIDER_MODEL:-anthropic/claude-3.5-sonnet}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-anthropic/claude-3.5-sonnet}
      SUPERVISOR_MODEL_NAME: ${SUPERVISOR_MODEL_NAME:-}
      AUDITAGENT_LLM_PROVIDER: ${AUDITAGENT_LLM_PROVIDER:-openai-compatible}

      # GitHub App Integration
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      AUDITAGENT_TOKEN_ENCRYPTION_KEY: ${AUDITAGENT_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:8173/api/auth/github/callback}
      AUDITAGENT_FRONTEND_URL: ${AUDITAGENT_FRONTEND_URL:-http://localhost:8173}
      GITHUB_APP_INSTALLATION_URL: ${GITHUB_APP_INSTALLATION_URL:-}
      AUDITAGENT_SECURE_COOKIES: ${AUDITAGENT_SECURE_COOKIES:-false}
      AUDITAGENT_SESSION_HOURS: ${AUDITAGENT_SESSION_HOURS:-24}

      # Scanner & Agent Settings
      AUDITAGENT_SCANNER_TIMEOUT_SECONDS: ${AUDITAGENT_SCANNER_TIMEOUT_SECONDS:-900}
      AUDITAGENT_SCANNER_HEARTBEAT_SECONDS: ${AUDITAGENT_SCANNER_HEARTBEAT_SECONDS:-15}
      AUDITAGENT_SANDBOX_ENABLED: ${AUDITAGENT_SANDBOX_ENABLED:-false}
      AUDITAGENT_SANDBOX_IMAGE: ${AUDITAGENT_SANDBOX_IMAGE:-auditagent-sandbox:latest}
      AUDITAGENT_SANDBOX_MEMORY: ${AUDITAGENT_SANDBOX_MEMORY:-2g}
      AUDITAGENT_SANDBOX_CPU: ${AUDITAGENT_SANDBOX_CPU:-2.0}
    volumes:
      # Persistent DuckDB knowledge base
      - auditagent_data:/var/lib/auditagent/data
      # Persistent workspace storage for git clones
      - auditagent_workspaces:/var/lib/auditagent/workspaces
      # Hot-reloadable security rules and stage skill playbooks
      - ./rules:/app/rules:ro
      - ./.auditagent/skills:/app/.auditagent/skills:ro
      # Optional: Docker daemon socket mount when AUDITAGENT_SANDBOX_ENABLED=true
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8173/api/auth/session || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - auditagent-net

  # ----------------------------------------------------------------------------
  # Frontend Development Server (Optional Profile: dev / frontend-dev)
  # Provides instant Vite Hot Module Replacement (HMR) for frontend development
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: auditagent-frontend-dev
    profiles:
      - dev
      - frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      VITE_BACKEND_URL: http://auditagent:8173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auditagent
    networks:
      - auditagent-net

  # ----------------------------------------------------------------------------
  # Agent Sandbox Image Builder (Optional Profile: sandbox)
  # Builds auditagent-sandbox:latest with tools for isolated command execution
  # ----------------------------------------------------------------------------
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: auditagent-sandbox:latest
    container_name: auditagent-sandbox-builder
    profiles:
      - sandbox
      - all

  # ----------------------------------------------------------------------------
  # pgAdmin 4 Database Administration Tool (Optional Profile: tools / admin)
  # Accessible at http://localhost:5050
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auditagent-pgadmin
    restart: unless-stopped
    profiles:
      - tools
      - admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@auditagent.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auditagent-net

volumes:
  postgres_data:
    name: auditagent_postgres_data
  auditagent_data:
    name: auditagent_duckdb_data
  auditagent_workspaces:
    name: auditagent_workspaces_data
  pgadmin_data:
    name: auditagent_pgadmin_data

networks:
  auditagent-net:
    name: auditagent_network
    driver: bridge
