spring:
  config:
    activate:
      on-profile: local
  devtools:
    restart:
      enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        model: ${PROVIDER_MODEL:openai/gpt-6-luna}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/auditagent}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:auditagent}
    password: ${RABBITMQ_PASSWORD:auditagent}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: ${RABBITMQ_PREFETCH:2}
        auto-startup: ${RABBITMQ_AUTO_STARTUP:true}
management:
  health:
    db:
      enabled: false

# Agentic remediation loop configuration
auditagent:
  mode: ${AUDITAGENT_MODE:all} # all | web | worker
  messaging:
    events-exchange: ${AUDITAGENT_EVENTS_EXCHANGE:auditagent.events}
  worker:
    enabled: ${AUDITAGENT_WORKER_ENABLED:true}
  supabase:
    url: ${SUPABASE_URL:http://localhost:8000}
    service-key: ${SUPABASE_SERVICE_KEY:}
    storage:
      bucket: ${SUPABASE_STORAGE_BUCKET:auditagent-artifacts}
      enabled: ${AUDITAGENT_STORAGE_REMOTE_ENABLED:true}
      timeout-seconds: ${AUDITAGENT_STORAGE_TIMEOUT_SECONDS:15}
      fallback-local-dir: ${AUDITAGENT_STORAGE_FALLBACK_LOCAL_DIR:.auditagent/storage}
  llm:
    # Mode can be 'user' (mandatory BYOK) or 'system' (legacy single-tenant / automated test mode)
    mode: ${AUDITAGENT_LLM_MODE:user}
    user-keys-required: ${AUDITAGENT_LLM_USER_KEYS_REQUIRED:true}
    provider: ${AUDITAGENT_LLM_PROVIDER:openai-compatible}
    openai:
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENAI_API_KEY:}
      model-name: ${OPENAI_MODEL_NAME:openai/gpt-6-luna}
      supervisor-model-name: ${SUPERVISOR_MODEL_NAME:typesafe/jev-1.14}
  jev:
    enabled: ${AUDITAGENT_JEV_ENABLED:true}
    base-url: ${AUDITAGENT_JEV_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${AUDITAGENT_JEV_API_KEY:${OPENAI_API_KEY:}}
    model-name: ${AUDITAGENT_JEV_MODEL:typesafe/jev-1.14}
    timeout-ms: ${AUDITAGENT_JEV_TIMEOUT_MS:3000}
    max-retries: ${AUDITAGENT_JEV_MAX_RETRIES:1}
    triage:
      enabled: ${AUDITAGENT_JEV_TRIAGE_ENABLED:true}
      confidence-threshold: ${AUDITAGENT_JEV_TRIAGE_CONFIDENCE:0.75}
      critical-confidence-threshold: ${AUDITAGENT_JEV_TRIAGE_CRITICAL_CONFIDENCE:0.95}
      max-batch-size: 10
      concurrency: ${AUDITAGENT_JEV_TRIAGE_CONCURRENCY:8}
      max-retries: 3
      backoff-initial-ms: 500
    supervisor:
      enabled: ${AUDITAGENT_JEV_SUPERVISOR_ENABLED:true}
      fallback-to-chat-model: true
  database:
    path: ${AUDITAGENT_DB_PATH:audit_reports.duckdb}
    batch-size: ${AUDITAGENT_DB_BATCH_SIZE:100}
  scanner:
    queue-priority: ${AUDITAGENT_SCANNER_QUEUE_PRIORITY:5}
    timeout-seconds: ${AUDITAGENT_SCANNER_TIMEOUT_SECONDS:900}
    heartbeat-seconds: ${AUDITAGENT_SCANNER_HEARTBEAT_SECONDS:15}
    max-target-bytes: ${AUDITAGENT_SCANNER_MAX_TARGET_BYTES:500000}
    max-memory-mb: ${AUDITAGENT_SCANNER_MAX_MEMORY_MB:1024}
    rule-timeout-seconds: ${AUDITAGENT_SCANNER_RULE_TIMEOUT_SECONDS:2}
  agent:
    max-iterations: 15
    compile-timeout-seconds: 120
    test-timeout-seconds: 180
    backup-dir: .auditagent/backups
    max-file-read-lines: 200
    max-retries: 3
    llm-call-timeout-seconds: 120
    max-tool-result-chars: 4000
    max-history-messages: 40
    max-consecutive-empty-responses: 3
    # Docker sandbox configuration
    sandbox-enabled: ${AUDITAGENT_SANDBOX_ENABLED:false}
    sandbox-image: ${AUDITAGENT_SANDBOX_IMAGE:auditagent-sandbox:latest}
    sandbox-memory-limit: ${AUDITAGENT_SANDBOX_MEMORY:2g}
    sandbox-cpu-limit: ${AUDITAGENT_SANDBOX_CPU:2.0}
  memory:
    enabled: true
    fts-enabled: true
    retention-days: 30
    context-token-budget: 12000
    candidate-limit: 50
    top-k: 8
    max-chat-chars: 8000
    max-tool-chars: 4000
    # Context compression settings
    summarization-enabled: ${AUDITAGENT_MEMORY_SUMMARIZATION:true}
    max-tool-output-chars: ${AUDITAGENT_MAX_TOOL_OUTPUT_CHARS:2000}
  github:
    app-id: ${GITHUB_APP_ID:}
    client-id: ${GITHUB_APP_CLIENT_ID:}
    client-secret: ${GITHUB_APP_CLIENT_SECRET:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET:}
    token-encryption-key: ${AUDITAGENT_TOKEN_ENCRYPTION_KEY:}
    callback-url: ${GITHUB_APP_CALLBACK_URL:http://localhost:8173/api/auth/github/callback}
    frontend-url: ${AUDITAGENT_FRONTEND_URL:http://localhost:5173}
    installation-url: ${GITHUB_APP_INSTALLATION_URL:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    authorize-url: ${GITHUB_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
    token-url: ${GITHUB_TOKEN_URL:https://github.com/login/oauth/access_token}
    workspace-root: ${AUDITAGENT_WORKSPACE_ROOT:${java.io.tmpdir}/auditagent-workspaces}
    secure-cookies: ${AUDITAGENT_SECURE_COOKIES:false}
    session-hours: ${AUDITAGENT_SESSION_HOURS:24}
    api-version: ${GITHUB_API_VERSION:2026-03-10}
